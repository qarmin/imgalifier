[package]
name = "imgalifier-heif"
description = "Pure-Rust HEIF/HEIC decoder: ISOBMFF container, shared pipeline (grid, alpha, transforms, YUV to RGB) and an HEVC still-picture decoder"
readme = "README.md"
keywords = ["heic", "heif", "avif", "image", "decoder"]
categories = ["multimedia::images", "multimedia::encoding"]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
repository = "https://github.com/qarmin/imgalifier"
rust-version = "1.85"

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"], optional = true }
brotli-decompressor = { version = "5", default-features = false, features = ["std"], optional = true }
image = { version = "0.25", default-features = false, optional = true }

[features]
default = ["hevc", "unci-compression"]
# HEVC still-picture decoder; disable to use only the container and the shared pipeline (the AVIF crate does this)
hevc = []
# deflate, zlib and brotli compressed uncompressed-HEIF (`unci`) items
unci-compression = ["dep:miniz_oxide", "dep:brotli-decompressor"]
# `register_decoding_hooks()` for the `image` crate (heic, heif, hif extensions)
image = ["dep:image"]

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp"] }
png = "0.18"
